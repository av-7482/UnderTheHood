name: Docker Build CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository #this is the line which is used to download the repositories from the github
        uses: actions/checkout@v6

      - name: Set up Docker Buildx #this is the line used to set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image # this is the line used to build the docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: underthehood:latest