
name: Docker Build CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/av-7482/underthehood:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/underthehood-key.pem
          chmod 600 ~/.ssh/underthehood-key.pem

          printf '%s\n' '3.107.69.157 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBRkZCtrLR+RK/pDzzI0P1SCzNVa2GJqEsBerbIwmn+5' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/underthehood-key.pem \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'EOF'
              set -e

              sudo docker pull ghcr.io/av-7482/underthehood:latest

              sudo docker rm -f underthehood-container || true

              sudo docker run -d \
                --name underthehood-container \
                --restart unless-stopped \
                -p 80:5000 \
                --env-file /home/ec2-user/underthehood/.env \
                ghcr.io/av-7482/underthehood:latest

              sudo docker ps --filter "name=underthehood-container"
          EOF
